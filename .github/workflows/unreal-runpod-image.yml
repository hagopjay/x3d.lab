name: unreal-runpod-image

on:
  push:
    branches: [main, claude/project-thread-yf9mso]
    paths:
      - 'docker/unreal-runpod/**'
      - '.github/workflows/unreal-runpod-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/unreal-runpod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/x3d-unreal-runpod:latest
            ghcr.io/${{ github.repository_owner }}/x3d-unreal-runpod:${{ github.sha }}
