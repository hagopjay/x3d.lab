; x3d.lab Unreal project settings. The double-brace fields are filled by x3due.project.write() for this GPU and run.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
-TargetedRHIs=SF_VULKAN_SM6
+TargetedRHIs={{SHADER_PLATFORM}}

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.RayTracing={{RAY_TRACING}}
r.PathTracing={{RAY_TRACING}}
r.SkinCache.CompileShaders={{RAY_TRACING}}
r.Lumen.HardwareRayTracing={{RAY_TRACING}}
r.Lumen.HardwareRayTracing.LightingMode={{HWRT_LIGHTING_MODE}}
; Substrate and MegaLights by engine version (x3due.project.features_for); no line for a feature the engine lacks
{{RENDER_FEATURES}}

[DevOptions.Shaders]
; ShaderCompileWorkers capped by RAM (x3due.tier.shader_workers): NumUnused = vCPUs - workers
NumUnusedShaderCompilingThreads={{UNUSED_SHADER_THREADS}}
NumUnusedShaderCompilingThreadsDuringGame={{UNUSED_SHADER_THREADS}}
ShaderCompilerCoreCountThreshold=4096
PercentageUnusedShaderCompilingThreads=0

[SystemSettings]
; alpha through post processing, for key-background stills. Set as a console variable: as a RendererSettings key
; UE 5.2 rejects True (an enum there).
r.PostProcessing.PropagateAlpha=1
{{SYSTEM_CVARS}}

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bDeveloperMode=False
bRemoteExecution=False

[/Script/UnrealEd.CrashReporterSettings]
bHideLogFilesOption=True
